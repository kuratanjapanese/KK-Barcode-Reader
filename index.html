<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>凝縮リーダー v6.3</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* 画面全体を固定してスクロールを禁止 */
        html, body { 
            height: 100%; margin: 0; padding: 0; overflow: hidden;
            font-family: sans-serif; background-color: #f0f2f5; 
            display: flex; flex-direction: column; align-items: center;
        }
        
        h2 { font-size: 18px; margin: 5px 0; color: #333; }

        /* スイッチを少し小さく */
        .switch-container {
            display: flex; align-items: center; gap: 10px;
            background: #fff; padding: 8px 20px; border-radius: 50px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 5px 0;
        }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ff9900; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #007bff; }
        input:checked + .slider:before { transform: translateX(24px); }

        /* カメラ画面を小さく固定 */
        #reader { width: 90%; max-width: 350px; border-radius: 12px; overflow: hidden; background: #000; height: 180px !important; }
        #reader__scan_region img { transform: scaleY(-1); }

        /* 情報カードもコンパクトに */
        .info-card { 
            background: white; padding: 10px; border-radius: 12px; 
            width: 90%; max-width: 350px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 8px;
        }
        .price-tag { font-size: 22px; color: #ff0033; font-weight: bold; margin: 2px 0; }
        .item-name { font-size: 13px; color: #333; height: 32px; overflow: hidden; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        
        .btn-container { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
        .btn { flex: 1; color: white; text-decoration: none; padding: 10px 0; border-radius: 6px; font-weight: bold; font-size: 13px; display: none; }
        .btn-amazon { background: #ff9900; }
        .btn-yahoo { background: #ff0033; }
        
        #res-code { font-size: 10px; color: #999; margin-top: 5px; }
    </style>
</head>
<body>

    <h2>二刀流リーダー v6.3</h2>

    <div class="switch-container">
        <span style="font-size:12px; font-weight:bold;">🛒 商品</span>
        <label class="switch">
            <input type="checkbox" id="mode-toggle" onchange="switchMode()">
            <span class="slider"></span>
        </label>
        <span style="font-size:12px; font-weight:bold;">🔗 QR</span>
    </div>
    
    <div id="reader"></div>

    <div class="info-card">
        <div id="status-label" style="font-size: 11px; font-weight: bold; color: #ff9900;">【バーコードモード】</div>
        <div id="item-name" class="item-name">スキャン待機中...</div>
        <div id="yahoo-price" class="price-tag">¥ ---</div>
        
        <div class="btn-container">
            <a id="amazon-link" class="btn btn-amazon" target="_blank">Amazon</a>
            <a id="yahoo-link" class="btn btn-yahoo" target="_blank">Yahoo!</a>
        </div>
        <div id="res-code">CODE: -</div>
    </div>

    <script>
        const CLIENT_ID = "dj00aiZpPUZYTWdEYTdlSHF1aCZzPWNvbnN1bWVyc2VjcmV0Jng9Zjc-";
        let html5QrCode;
        let isScanning = true;

        async function fetchYahooData(janCode) {
            const url = `https://corsproxy.io/?${encodeURIComponent("https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?appid="+CLIENT_ID+"&jan_code="+janCode)}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.hits && data.hits.length > 0) {
                    const item = data.hits[0];
                    document.getElementById('item-name').innerText = item.name;
                    document.getElementById('yahoo-price').innerText = `¥ ${item.price.toLocaleString()}`;
                } else {
                    document.getElementById('item-name').innerText = "未登録の商品";
                }
            } catch (e) { document.getElementById('item-name').innerText = "検索エラー"; }
        }

        async function startScanner() {
            if (html5QrCode) {
                await html5QrCode.stop();
                html5QrCode.clear();
            }
            html5QrCode = new Html5Qrcode("reader");
            const isQRMode = document.getElementById('mode-toggle').checked;
            
            // 画面に収まるようにさらにコンパクトな設定
            const config = { 
                fps: 10, 
                qrbox: isQRMode ? { width: 140, height: 140 } : { width: 220, height: 80 },
                aspectRatio: 1.77 // カメラ映像自体を横長に固定
            };

            document.getElementById('status-label').innerText = isQRMode ? "【QRモード】" : "【バーコードモード】";
            document.getElementById('status-label').style.color = isQRMode ? "#007bff" : "#ff9900";

            html5QrCode.start({ facingMode: "environment" }, config, (text) => {
                if (!isScanning) return;
                isScanning = false;
                document.getElementById('res-code').innerText = "CODE: " + text;
                if (isQRMode) {
                    if (text.startsWith('http')) window.open(text, '_blank');
                    else alert("QR: " + text);
                } else {
                    document.getElementById('amazon-link').style.display = 'block';
                    document.getElementById('amazon-link').href = "https://www.amazon.co.jp/s?k=" + text;
                    document.getElementById('yahoo-link').style.display = 'block';
                    document.getElementById('yahoo-link').href = "https://shopping.yahoo.co.jp/search?p=" + text;
                    fetchYahooData(text);
                }
                setTimeout(() => { isScanning = true; }, 3000);
            });
        }

        function switchMode() { startScanner(); }
        window.onload = startScanner;
    </script>
</body>
</html>
