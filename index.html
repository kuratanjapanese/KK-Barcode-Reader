<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全画面フィット v6.9</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* 画面全体のスクロールを完全に禁止 */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100vh; 
            overflow: hidden; font-family: sans-serif; 
            background-color: #000; color: #fff;
            display: flex; flex-direction: column;
        }
        
        /* ヘッダー：高さ固定 */
        .header {
            height: 60px; padding: 5px; background: rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
        }
        .switch-container {
            display: flex; align-items: center; gap: 10px;
            background: #fff; padding: 5px 20px; border-radius: 50px;
        }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ff9900; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #007bff; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* カメラ：残りの画面の約55%〜60%を占有 */
        #reader { 
            flex-grow: 1; width: 100%; background: #000; 
            /* Html5Qrcodeの内蔵スタイルを上書きして画面にフィットさせる */
        }
        #reader__scan_region img { transform: scaleY(-1); }

        /* 情報パネル：下部に固定、高さはコンテンツに合わせつつ調整 */
        .info-panel {
            background: white; color: #333; padding: 10px;
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 5px;
        }
        .item-name { font-size: 12px; font-weight: bold; height: 2.4em; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
        .price-tag { font-size: 24px; color: #ff0033; font-weight: bold; text-align: center; }
        
        .btn-container { display: flex; gap: 5px; }
        .btn { flex: 1; color: white; text-decoration: none; padding: 10px 0; border-radius: 8px; font-weight: bold; font-size: 11px; display: none; text-align: center; }
        .btn-amazon { background: #ff9900; }
        .btn-yahoo { background: #ff0033; }
        .btn-google { background: #4285F4; }
        
        .force-btn {
            width: 100%; background: #666; color: white; border: none;
            padding: 8px; border-radius: 6px; font-size: 11px; font-weight: bold; display: none;
        }
        #res-code { font-size: 9px; color: #888; text-align: center; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="switch-container">
            <span style="color:#555; font-size:11px; font-weight:bold;">🛒 商品</span>
            <label class="switch">
                <input type="checkbox" id="mode-toggle" onchange="switchMode()">
                <span class="slider"></span>
            </label>
            <span style="color:#555; font-size:11px; font-weight:bold;">🔗 QR</span>
        </div>
        <div id="status-label" style="font-size:10px; font-weight:bold; color:#ff9900;">【バーコードモード】</div>
    </div>
    
    <div id="reader"></div>

    <div class="info-panel">
        <div id="item-name" class="item-name">スキャンを待機中...</div>
        <div id="yahoo-price" class="price-tag">¥ ---</div>
        
        <div class="btn-container">
            <a id="amazon-link" class="btn btn-amazon" target="_blank">Amazon</a>
            <a id="yahoo-link" class="btn btn-yahoo" target="_blank">Yahoo!</a>
            <a id="google-link" class="btn btn-google" target="_blank">Google</a>
        </div>
        <button id="force-btn" class="force-btn" onclick="forceSearch()">コードで直接再検索</button>
        <div id="res-code">CODE: -</div>
    </div>

    <script>
        const CLIENT_ID = "dj00aiZpPUZYTWdEYTdlSHF1aCZzPWNvbnN1bWVyc2VjcmV0Jng9Zjc-";
        let html5QrCode;
        let isScanning = true;
        let lastCode = "";

        async function fetchYahooData(janCode) {
            const url = `https://corsproxy.io/?${encodeURIComponent("https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?appid="+CLIENT_ID+"&jan_code="+janCode)}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.hits && data.hits.length > 0) {
                    const item = data.hits[0];
                    document.getElementById('item-name').innerText = item.name;
                    document.getElementById('yahoo-price').innerText = `¥ ${item.price.toLocaleString()}`;
                } else {
                    document.getElementById('item-name').innerText = "商品名不明";
                }
                updateUI(janCode);
            } catch (e) { document.getElementById('item-name').innerText = "検索エラー"; }
        }

        function updateUI(code) {
            document.getElementById('amazon-link').href = "https://www.amazon.co.jp/s?k=" + encodeURIComponent(code);
            document.getElementById('amazon-link').style.display = 'block';
            document.getElementById('yahoo-link').href = "https://shopping.yahoo.co.jp/search?p=" + encodeURIComponent(code);
            document.getElementById('yahoo-link').style.display = 'block';
            document.getElementById('google-link').href = "https://www.google.com/search?q=" + encodeURIComponent(code);
            document.getElementById('google-link').style.display = 'block';
            document.getElementById('force-btn').style.display = 'block';
        }

        function forceSearch() {
            if (lastCode) window.open("https://www.google.com/search?q=" + encodeURIComponent(lastCode), '_blank');
        }

        async function startScanner() {
            if (html5QrCode) { await html5QrCode.stop(); html5QrCode.clear(); }
            html5QrCode = new Html5Qrcode("reader");
            const isQRMode = document.getElementById('mode-toggle').checked;
            
            // 画面の高さに合わせて、qrboxのサイズも動的に調整
            const readerElement = document.getElementById('reader');
            const boxWidth = Math.min(readerElement.clientWidth * 0.8, 300);
            const boxHeight = isQRMode ? boxWidth : boxWidth * 0.5;

            const config = { 
                fps: 20, 
                qrbox: { width: boxWidth, height: boxHeight },
                aspectRatio: readerElement.clientWidth / readerElement.clientHeight
            };

            document.getElementById('status-label').innerText = isQRMode ? "【QRモード】" : "【バーコードモード】";
            document.getElementById('status-label').style.color = isQRMode ? "#007bff" : "#ff9900";

            html5QrCode.start({ facingMode: "environment" }, config, (text) => {
                if (!isScanning) return;
                isScanning = false;
                lastCode = text;
                document.getElementById('res-code').innerText = "CODE: " + text;
                if (isQRMode) {
                    if (text.startsWith('http')) window.open(text, '_blank');
                    updateUI(text);
                } else {
                    fetchYahooData(text);
                }
                setTimeout(() => { isScanning = true; }, 3000);
            });
        }
        function switchMode() { startScanner(); }
        window.onload = startScanner;
    </script>
</body>
</html>
