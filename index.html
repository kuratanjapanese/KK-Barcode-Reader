<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>全自動リーダー v7.3</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100dvh; 
            overflow: hidden; font-family: sans-serif; 
            background-color: #000; color: #fff;
            display: flex; flex-direction: column;
        }
        
        .header { height: 40px; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 10; }
        .auto-label { font-size: 12px; font-weight: bold; color: #00ffcc; letter-spacing: 2px; }

        #reader { flex-grow: 1; width: 100%; background: #000; overflow: hidden; }
        #reader__scan_region img { transform: scaleY(-1); }

        .info-panel {
            background: white; color: #333; 
            padding: 8px 8px 30px 8px; 
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; gap: 5px;
            z-index: 10;
        }
        .item-name { font-size: 11px; font-weight: bold; height: 2.2em; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
        .price-tag { font-size: 18px; color: #ff0033; font-weight: bold; text-align: center; margin: -2px 0; }
        
        .search-grid { display: flex; gap: 4px; }
        .search-column { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        
        .btn { color: white; text-decoration: none; padding: 10px 0; border-radius: 6px; font-weight: bold; font-size: 10px; text-align: center; display: none; }
        .btn-amazon { background: #ff9900; }
        .btn-yahoo { background: #ff0033; }
        .btn-google { background: #4285F4; }
        
        .code-btn { background: #666; color: white; text-decoration: none; padding: 5px 0; border-radius: 4px; font-size: 8px; text-align: center; display: none; }

        #res-code { font-size: 8px; color: #888; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="auto-label">● AUTO DETECTING...</div>
    </div>
    
    <div id="reader"></div>

    <div class="info-panel">
        <div id="item-name" class="item-name">スキャンしてください</div>
        <div id="yahoo-price" class="price-tag">¥ ---</div>
        
        <div class="search-grid">
            <div class="search-column">
                <a id="amz-main" class="btn btn-amazon" target="_blank">Amazon</a>
                <a id="amz-code" class="code-btn" target="_blank">コード検索</a>
            </div>
            <div class="search-column">
                <a id="yho-main" class="btn btn-yahoo" target="_blank">Yahoo!</a>
                <a id="yho-code" class="code-btn" target="_blank">コード検索</a>
            </div>
            <div class="search-column">
                <a id="ggl-main" class="btn btn-google" target="_blank">Google</a>
                <a id="ggl-code" class="code-btn" target="_blank">コード検索</a>
            </div>
        </div>
        <div id="res-code">CODE: -</div>
    </div>

    <script>
        const CLIENT_ID = "dj00aiZpPUZYTWdEYTdlSHF1aCZzPWNvbnN1bWVyc2VjcmV0Jng9Zjc-";
        let html5QrCode;
        let isScanning = true;

        async function fetchYahooData(janCode) {
            const url = `https://corsproxy.io/?${encodeURIComponent("https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?appid="+CLIENT_ID+"&jan_code="+janCode)}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                let name = janCode; 
                if (data.hits && data.hits.length > 0) {
                    name = data.hits[0].name;
                    document.getElementById('item-name').innerText = name;
                    document.getElementById('yahoo-price').innerText = `¥ ${data.hits[0].price.toLocaleString()}`;
                } else {
                    document.getElementById('item-name').innerText = "商品名不明";
                }
                updateButtons(name, janCode);
            } catch (e) { document.getElementById('item-name').innerText = "エラー"; }
        }

        function updateButtons(query, code) {
            const ids = ['amz-main', 'amz-code', 'yho-main', 'yho-code', 'ggl-main', 'ggl-code'];
            ids.forEach(id => document.getElementById(id).style.display = 'block');
            document.getElementById('amz-main').href = "https://www.amazon.co.jp/s?k=" + encodeURIComponent(query);
            document.getElementById('amz-code').href = "https://www.amazon.co.jp/s?k=" + encodeURIComponent(code);
            document.getElementById('yho-main').href = "https://shopping.yahoo.co.jp/search?p=" + encodeURIComponent(code);
            document.getElementById('yho-code').href = "https://shopping.yahoo.co.jp/search?p=" + encodeURIComponent(code);
            document.getElementById('ggl-main').href = "https://www.google.com/search?q=" + encodeURIComponent(query);
            document.getElementById('ggl-code').href = "https://www.google.com/search?q=" + encodeURIComponent(code);
        }

        async function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const readerWidth = document.getElementById('reader').clientWidth;
            // どちらも対応するため、スキャン領域は少し大きめの正方形に設定
            const boxSize = Math.min(readerWidth * 0.8, 250);
            
            // 全フォーマット対応モードで起動
            html5QrCode.start({ facingMode: "environment" }, 
            { fps: 20, qrbox: { width: boxSize, height: boxSize } }, 
            (text) => {
                if (!isScanning) return;
                isScanning = false;
                document.getElementById('res-code').innerText = "CODE: " + text;

                // 読み取った内容がURLかどうか判別
                if (text.startsWith('http')) {
                    document.getElementById('item-name').innerText = "URLを検出しました";
                    document.getElementById('yahoo-price').innerText = "¥ ---";
                    window.open(text, '_blank');
                    updateButtons(text, text);
                } else {
                    // 数字や物流コードなら商品検索へ
                    fetchYahooData(text);
                }
                setTimeout(() => { isScanning = true; }, 3000);
            });
        }
        window.onload = startScanner;
    </script>
</body>
</html>
