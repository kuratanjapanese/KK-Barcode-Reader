<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全方式対応リーダー v3.3</title>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 10px; transition: background-color 0.3s; }
        .flash { background-color: #a7ffeb !important; }
        #interactive { width: 100%; max-width: 400px; height: 250px; margin: 10px auto; border: 5px solid #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .info-card { background: white; padding: 15px; border-radius: 15px; display: inline-block; width: 95%; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .price-tag { font-size: 28px; color: #ff0033; font-weight: bold; margin: 10px 0; }
        .item-name { font-size: 14px; color: #333; min-height: 45px; display: flex; align-items: center; justify-content: center; font-weight: bold; padding: 0 5px; }
        .btn-container { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn { flex: 1; color: white; text-decoration: none; padding: 12px 5px; border-radius: 8px; font-weight: bold; font-size: 14px; display: none; }
        .btn-amazon { background: #ff9900; }
        .btn-yahoo { background: #ff0033; }
        .history-area { text-align: left; max-width: 400px; margin: 0 auto; background: rgba(255,255,255,0.7); padding: 15px; border-radius: 10px; font-size: 12px; }
    </style>
</head>
<body>

    <h2 style="color:#333;">全方式対応リーダー v3.3</h2>
    <div id="interactive"></div>

    <div class="info-card">
        <div id="item-name" class="item-name">バーコードをスキャンしてね</div>
        <div id="yahoo-price" class="price-tag">¥ ---</div>
        <div id="res-code" style="font-size: 12px; color: #999; margin-bottom: 10px;">JAN: -</div>
        
        <div class="btn-container">
            <a id="amazon-link" class="btn btn-amazon" target="_blank">Amazon</a>
            <a id="yahoo-link" class="btn btn-yahoo" target="_blank">Yahoo!</a>
        </div>
    </div>

    <div class="history-area">
        <strong>📜 スキャン履歴</strong>
        <div id="history-list"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
    <script>
        const CLIENT_ID = "dj00aiZpPUZYTWdEYTdlSHF1aCZzPWNvbnN1bWVyc2VjcmV0Jng9Zjc-";

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        async function fetchYahooData(janCode) {
            const yahooUrl = `https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?appid=${CLIENT_ID}&jan_code=${janCode}`;
            const url = `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.hits && data.hits.length > 0) {
                    const item = data.hits[0];
                    document.getElementById('item-name').innerText = item.name;
                    document.getElementById('yahoo-price').innerText = `¥ ${item.price.toLocaleString()}`;
                } else {
                    document.getElementById('item-name').innerText = "Yahoo!に未登録の商品です";
                    document.getElementById('yahoo-price').innerText = "¥ ---";
                }
            } catch (e) {
                document.getElementById('item-name').innerText = "API読み込みエラー";
                console.error(e);
            }
        }

        // v3.3: 主要なバーコード方式をすべて追加！
        Quagga.init({
            inputStream: { 
                type: "LiveStream", 
                target: document.querySelector('#interactive'), 
                constraints: { 
                    facingMode: "environment",
                    width: { min: 1280 }, // 高解像度にして精度UP
                    height: { min: 720 }
                } 
            },
            locate: true,
            decoder: { 
                // 対応方式を全開放！
                readers: [
                    "ean_reader",      // JAN-13（いろはす等）
                    "ean_8_reader",    // JAN-8（アポロ等）
                    "code_128_reader", // 物流などで使われる方式
                    "code_39_reader",  // 工業などで使われる方式
                    "upc_reader",      // 海外の方式
                    "upc_e_reader"     // 海外の短縮方式
                ],
                multiple: false 
            },
            patchSize: "medium",
            halfSample: false // ファイルサイズ無視！精度を最大にする
        }, (err) => { 
            if(err) {
                document.getElementById('item-name').innerText = "カメラ起動エラー";
                return;
            }
            Quagga.start(); 
        });

        let isScanning = true;
        Quagga.onDetected((data) => {
            if (!isScanning) return;
            const code = data.codeResult.code;
            isScanning = false;

            playBeep();
            document.body.classList.add('flash');
            setTimeout(() => document.body.classList.remove('flash'), 300);

            document.getElementById('res-code').innerText = "JAN: " + code;
            
            const amz = document.getElementById('amazon-link');
            amz.href = "https://www.amazon.co.jp/s?k=" + code;
            amz.style.display = 'block';

            const yho = document.getElementById('yahoo-link');
            yho.href = "https://shopping.yahoo.co.jp/search?p=" + code;
            yho.style.display = 'block';

            fetchYahooData(code);

            const historyList = document.getElementById('history-list');
            const newItem = document.createElement('div');
            newItem.style.borderBottom = "1px dotted #ccc";
            newItem.style.padding = "3px 0";
            newItem.innerText = `${new Date().toLocaleTimeString()} - ${code}`;
            historyList.prepend(newItem);

            setTimeout(() => { isScanning = true; }, 3000);
        });
    </script>
</body>
</html>
