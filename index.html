<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最強2画面リーダー v5.0</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 5px; }
        .scanner-label { background: #333; color: white; font-size: 12px; padding: 5px; border-radius: 5px 5px 0 0; display: block; width: fit-content; margin: 0 auto; }
        .scanner-container { width: 100%; max-width: 400px; margin: 0 auto 10px; border: 3px solid #333; border-radius: 10px; overflow: hidden; height: 180px; background: #000; }
        
        .info-card { background: white; padding: 10px; border-radius: 15px; display: inline-block; width: 95%; max-width: 400px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 10px; }
        .price-tag { font-size: 24px; color: #ff0033; font-weight: bold; margin: 5px 0; }
        .item-name { font-size: 13px; color: #333; font-weight: bold; min-height: 35px; }
        
        .history-area { text-align: left; max-width: 400px; margin: 0 auto; background: rgba(255,255,255,0.7); padding: 10px; border-radius: 10px; font-size: 11px; max-height: 80px; overflow-y: auto; }
    </style>
</head>
<body>

    <span class="scanner-label">🛒 商品バーコード用</span>
    <div id="barcode-reader" class="scanner-container"></div>

    <div class="info-card">
        <div id="item-name" class="item-name">バーコードをスキャン！</div>
        <div id="yahoo-price" class="price-tag">¥ ---</div>
        <div id="res-code" style="font-size: 11px; color: #999;">CODE: -</div>
    </div>

    <span class="scanner-label">🔗 QRコード用</span>
    <div id="qr-reader" class="scanner-container"></div>

    <div class="history-area">
        <strong>📜 履歴:</strong> <span id="history-list"></span>
    </div>

    <script>
        const CLIENT_ID = "dj00aiZpPUZYTWdEYTdlSHF1aCZzPWNvbnN1bWVyc2VjcmV0Jng9Zjc-";
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq = 880) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        async function fetchYahooData(janCode) {
            const url = `https://corsproxy.io/?${encodeURIComponent("https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?appid="+CLIENT_ID+"&jan_code="+janCode)}`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.hits && data.hits.length > 0) {
                    const item = data.hits[0];
                    document.getElementById('item-name').innerText = item.name;
                    document.getElementById('yahoo-price').innerText = `¥ ${item.price.toLocaleString()}`;
                } else {
                    document.getElementById('item-name').innerText = "未登録の商品";
                }
            } catch (e) { document.getElementById('item-name').innerText = "通信エラー"; }
        }

        // --- バーコードリーダー設定 ---
        const barcodeScanner = new Html5Qrcode("barcode-reader");
        barcodeScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 250, height: 100 } },
            (text) => {
                playBeep(880);
                document.getElementById('res-code').innerText = "JAN: " + text;
                fetchYahooData(text);
                addHistory(text);
            }
        );

        // --- QRリーダー設定（外カメラ固定） ---
        const qrScanner = new Html5Qrcode("qr-reader");
        qrScanner.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: { width: 150, height: 150 } },
            (text) => {
                playBeep(1320);
                if (text.startsWith('http')) {
                    window.open(text, '_blank');
                } else {
                    alert("QR内容: " + text);
                }
                addHistory("QR: " + text);
            }
        );

        function addHistory(msg) {
            const list = document.getElementById('history-list');
            list.innerText = msg + " | " + list.innerText;
        }
    </script>
</body>
</html>
